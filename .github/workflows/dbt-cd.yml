name: CD

on:
  push:
    branches: [main]

jobs:

  dbt-deploy:
    name: Deploy dbt Models
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-bigquery

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt

          cat > ~/.dbt/profiles.yml <<'EOF'
          retail_analytics:
            target: dev

            outputs:
              dev:
                type: bigquery
                method: oauth
                project: retail-data-platform-507908
                dataset: retail_analytics
                location: europe-north1
                threads: 4
          EOF

      - name: Run dbt
        working-directory: dbt/retail_analytics
        run: dbt run